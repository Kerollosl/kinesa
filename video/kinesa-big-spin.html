    <div id="stage">

      <button id="play">▶ Play (click or space)</button>
    </div>
    <script>
      "use strict";
      // =====================================================================
      // Kinesa · The Big Spin. Every frame is a pure function of time t.
      // Picture and sound read the same cue sheet (CUE) so they stay in sync.
      // =====================================================================
      const W = 1920, H = 1080, FPS = 24, DURATION = 30;
      const GROUND = 860;
      const RENDER = new URLSearchParams(location.search).has("render");

      // ---------- shared companion model (src/companions/model.js) ----------
      // The four Gospel companions as flat 2D, one-piece cartoon characters.
// Shared by the app (src/companions/canvas.js draws them with Canvas2D) and
// the film (video/, drawn with WebGL signed-distance shaders). A character is
// a list of primitives built from a pose; nothing here touches the DOM.
//
// Primitive types: 0 ellipse, 1 tapered capsule, 2 round box, 3 arc stroke,
// 4 scallop, 5 trapezoid, 6 ellipse ring, 7 rounded triangle, 8 soft blob.
// ---------- small math ----------
const TAU = Math.PI * 2;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, u) => a + (b - a) * u;
const fract = (x) => x - Math.floor(x);
const ease = {
  lin: (u) => u,
  in: (u) => u * u * u,
  out: (u) => 1 - (1 - u) ** 3,
  out2: (u) => 1 - (1 - u) ** 2,
  inOut: (u) => (u < 0.5 ? 4 * u * u * u : 1 - (-2 * u + 2) ** 3 / 2),
  sine: (u) => 0.5 - 0.5 * Math.cos(Math.PI * u),
  back: (u) => {
    const c = 1.7;
    return 1 + (c + 1) * (u - 1) ** 3 + c * (u - 1) ** 2;
  },
  hold: (u) => (u < 1 ? 0 : 1),
};
// Seeded randomness: a pure hash, never Math.random.
function hash(i, s = 0) {
  let n = (Math.imul(i | 0, 374761393) + Math.imul(s | 0, 668265263)) | 0;
  n = Math.imul(n ^ (n >>> 13), 1274126177);
  n ^= n >>> 16;
  return (n >>> 0) / 4294967296;
}
const hex = (c) => [
  parseInt(c.slice(1, 3), 16) / 255,
  parseInt(c.slice(3, 5), 16) / 255,
  parseInt(c.slice(5, 7), 16) / 255,
];
const INK = "#2a2230";

// ---------- 2D affine matrices ----------
const M = {
  id: () => [1, 0, 0, 1, 0, 0],
  mul: (m, n) => [
    m[0] * n[0] + m[2] * n[1],
    m[1] * n[0] + m[3] * n[1],
    m[0] * n[2] + m[2] * n[3],
    m[1] * n[2] + m[3] * n[3],
    m[0] * n[4] + m[2] * n[5] + m[4],
    m[1] * n[4] + m[3] * n[5] + m[5],
  ],
  tr: (x, y) => [1, 0, 0, 1, x, y],
  rot: (a) => [Math.cos(a), Math.sin(a), -Math.sin(a), Math.cos(a), 0, 0],
  sc: (x, y) => [x, 0, 0, y, 0, 0],
  ap: (m, x, y) => [m[0] * x + m[2] * y + m[4], m[1] * x + m[3] * y + m[5]],
  inv: (m) => {
    const det = m[0] * m[3] - m[1] * m[2];
    const a = m[3] / det,
      b = -m[1] / det,
      c = -m[2] / det,
      d = m[0] / det;
    return [a, b, c, d, -(a * m[4] + c * m[5]), -(b * m[4] + d * m[5])];
  },
};

// ---------- shape groups (signed-distance primitives) ----------
// type: 0 ellipse, 1 tapered capsule, 2 round box, 3 arc stroke,
// 4 scallop, 5 trapezoid, 6 ellipse ring, 7 rounded triangle, 8 soft blob
class Group {
  constructor() {
    this.prims = [];
    this.m = M.id();
    this.stack = [];
  }
  save() {
    this.stack.push(this.m);
  }
  restore() {
    this.m = this.stack.pop();
  }
  apply(n) {
    this.m = M.mul(this.m, n);
  }
  get k() {
    return Math.sqrt(Math.abs(this.m[0] * this.m[3] - this.m[1] * this.m[2]));
  }
  get ang() {
    return Math.atan2(this.m[1], this.m[0]);
  }
  add(type, x, y, ang, p, col, br, o = {}) {
    const [wx, wy] = M.ap(this.m, x, y);
    this.prims.push({
      type,
      x: wx,
      y: wy,
      ang: ang + this.ang,
      p,
      col: typeof col === "string" ? hex(col) : col,
      shade: o.shade ?? 1,
      ol: o.ol ?? 2.6,
      clip: o.clip ?? -1,
      clipMode: o.clipMode ?? 1,
      alpha: o.alpha ?? 1,
      br,
    });
    return this.prims.length - 1;
  }
  ellipse(x, y, rx, ry, col, o = {}) {
    const sx = Math.hypot(this.m[0], this.m[1]);
    const sy = Math.hypot(this.m[2], this.m[3]);
    const a = o.ang || 0;
    const swap = Math.abs(Math.sin(a)) > 0.7071;
    const ex = rx * (swap ? sy : sx),
      ey = ry * (swap ? sx : sy);
    return this.add(0, x, y, a, [ex, ey, 0, 0], col, Math.max(ex, ey), o);
  }
  circle(x, y, r, col, o) {
    return this.ellipse(x, y, r, r, col, o);
  }
  soft(x, y, rx, ry, col, o = {}) {
    const k = this.k;
    return this.add(
      8,
      x,
      y,
      o.ang || 0,
      [rx * k, ry * k, o.core ?? 0.2, 0],
      col,
      Math.max(rx, ry) * k,
      { shade: 0, ol: 0, ...o },
    );
  }
  capsule(ax, ay, bx, by, r1, r2, col, o = {}) {
    const A = M.ap(this.m, ax, ay),
      B = M.ap(this.m, bx, by);
    const k = this.k;
    const len = Math.max(0.01, Math.hypot(B[0] - A[0], B[1] - A[1]));
    const ang = Math.atan2(B[1] - A[1], B[0] - A[0]);
    this.prims.push({
      type: 1,
      x: A[0],
      y: A[1],
      ang,
      p: [r1 * k, r2 * k, len, 0],
      col: hex(col),
      shade: o.shade ?? 1,
      ol: o.ol ?? 2.6,
      clip: o.clip ?? -1,
      clipMode: o.clipMode ?? 1,
      alpha: o.alpha ?? 1,
      br: len + Math.max(r1, r2) * k,
    });
    return this.prims.length - 1;
  }
  box(x, y, hx, hy, r, col, o = {}) {
    const sx = Math.hypot(this.m[0], this.m[1]);
    const sy = Math.hypot(this.m[2], this.m[3]);
    return this.add(
      2,
      x,
      y,
      o.ang || 0,
      [hx * sx, hy * sy, r * Math.min(sx, sy), 0],
      col,
      Math.hypot(hx * sx, hy * sy),
      o,
    );
  }
  arc(x, y, ra, a0, a1, th, col, o = {}) {
    const k = this.k;
    return this.add(
      3,
      x,
      y,
      o.ang || 0,
      [ra * k, a0, a1, th * k],
      col,
      (ra + th) * k,
      { shade: 0, ol: 0, ...o },
    );
  }
  scallop(x, y, R, A, N, ph, col, o = {}) {
    const k = this.k;
    return this.add(
      4,
      x,
      y,
      o.ang || 0,
      [R * k, A * k, N, ph],
      col,
      (R + A) * k + 2,
      o,
    );
  }
  trap(x, y, r1, r2, he, round, col, o = {}) {
    const sx = Math.hypot(this.m[0], this.m[1]);
    const sy = Math.hypot(this.m[2], this.m[3]);
    return this.add(
      5,
      x,
      y,
      o.ang || 0,
      [r1 * sx, r2 * sx, he * sy, round * Math.min(sx, sy)],
      col,
      Math.hypot(Math.max(r1, r2) * sx, he * sy) + round,
      o,
    );
  }
  ring(x, y, rx, ry, th, col, o = {}) {
    const k = this.k;
    return this.add(
      6,
      x,
      y,
      o.ang || 0,
      [rx * k, ry * k, th * k, 0],
      col,
      (Math.max(rx, ry) + th) * k,
      o,
    );
  }
  tri(x, y, size, half, round, col, o = {}) {
    const k = this.k;
    return this.add(
      7,
      x,
      y,
      o.ang || 0,
      [size * k, half * k, round * k, 0],
      col,
      (size + half + round) * k,
      o,
    );
  }
}

// Rest pose; every character pose starts from this. `k` scales the model.
const basePose = (o = {}) => ({
  k: 1,
  x: 0,
  y: 0,
  lift: 0,
  lean: 0,
  sx: 1,
  sy: 1,
  turn: 0.75,
  sit: 0,
  bob: 0,
  headTilt: 0,
  look: [0.4, 0],
  face: "happy",
  blink: 0,
  flap: 0,
  walk: null,
  arms: { L: { ang: 1.75 }, R: { ang: 1.3 } },
  tail: 0,
  t: 0,
  visible: true,
  ...o,
});

// Characters are modelled ~200 units tall with feet at y = 0; P.k scales them.
function rootMatrix(P) {
  const k = P.k ?? 1;
  return M.mul(
    M.tr(P.x, P.y - P.lift),
    M.mul(M.rot(P.lean), M.sc(P.sx * k, P.sy * k)),
  );
}
// Shoulder in body space (screen side -1 left, +1 right).
function shoulderLocal(S, P, side) {
  const T = P.turn,
    sg = T >= 0 ? 1 : -1;
  const near = side === sg;
  const b = S.shoulder[side < 0 ? 0 : 1];
  return [
    b[0] + T * (near ? 6 : 50),
    b[1] + P.sit * S.sitDrop + P.bob - (near ? 0 : 4 * Math.abs(T)),
  ];
}
function bodyLocal(S, P) {
  return {
    c: [S.bodyC[0] + P.turn * 4, S.bodyC[1] + P.sit * S.sitDrop + P.bob],
    r: [S.bodyR[0] * (1 - 0.08 * Math.abs(P.turn)), S.bodyR[1]],
  };
}

function drawWings(g, P, S) {
  const T = P.turn;
  const root = [S.wingRoot[0], S.wingRoot[1] + P.sit * S.sitDrop + P.bob];
  const lobes = [
    [-12, 46, 12, 9],
    [-38, 42, 12, 9],
    [-62, 33, 11, 8],
  ];
  for (const side of [-1, 1]) {
    const back = side === (T >= 0 ? -1 : 1);
    const scale = back ? 1 + 0.08 * Math.abs(T) : 1 - 0.3 * Math.abs(T);
    const rx = side * root[0] - T * 16;
    const flap = (P.flap + 0.05 * Math.sin(P.t * 2.3 + side)) * side;
    for (const [deg, len, r1, r2] of lobes) {
      const a = (deg * Math.PI) / 180 - flap * 0.6;
      const dir =
        side > 0 ? [Math.cos(a), Math.sin(a)] : [-Math.cos(a), Math.sin(a)];
      g.capsule(
        rx,
        root[1],
        rx + dir[0] * len * scale,
        root[1] + dir[1] * len * scale,
        r1,
        r2,
        WING,
      );
    }
  }
}

function drawTail(g, P, S, kind) {
  if (kind === "mattie") return;
  const sg = P.turn >= 0 ? 1 : -1;
  const sw = Math.sin(P.t * 3.1 + P.tail) * 0.25;
  const y0 = (kind === "juno" ? -22 : -34) + P.sit * S.sitDrop;
  const bx = -sg * (S.bodyR[0] - 6);
  if (kind === "juno") {
    for (const k of [-1, 0, 1]) {
      const a = Math.PI / 2 + sg * (0.55 + k * 0.28) + sw * 0.3;
      g.capsule(
        bx * 0.6,
        y0,
        bx * 0.6 + Math.cos(a) * 30,
        y0 + Math.sin(a) * 30,
        8,
        6,
        "#fbf7ef",
      );
    }
    return;
  }
  const mid = [bx - sg * 22, y0 - 14 + sw * 10];
  const tip = [bx - sg * (30 + sw * 8), y0 - 38];
  const col = kind === "leo" ? S.body : S.body;
  g.capsule(bx, y0, mid[0], mid[1], 5, 4.2, col);
  g.capsule(mid[0], mid[1], tip[0], tip[1], 4.2, 3.6, col);
  g.scallop(
    tip[0],
    tip[1] - 4,
    8,
    3.5,
    7,
    P.t * 2,
    kind === "leo" ? "#c85d17" : "#6e3a1d",
  );
}

function drawFeet(g, P, S, kind) {
  const T = P.turn,
    aT = Math.abs(T),
    sg = T >= 0 ? 1 : -1;
  for (const side of [-1, 1]) {
    let fx = side * S.footX * (1 - 0.45 * aT) + T * 6;
    let fy = -S.footR[1] * 0.85;
    let lift = 0,
      ang = 0,
      rx = S.footR[0],
      ry = S.footR[1];
    if (P.walk) {
      const u = fract(P.walk.phase + (side > 0 ? 0.5 : 0));
      const st = P.walk.stride / (P.k ?? 1);
      let off;
      if (u < 0.5) off = st * (0.25 - u);
      else {
        const v = (u - 0.5) / 0.5;
        off = st * (-0.25 + 0.5 * ease.sine(v));
        lift = Math.sin(Math.PI * v) * P.walk.lift;
      }
      fx += off * sg;
      ang = -sg * lift * 0.012;
    }
    if (P.sit > 0) {
      fx = lerp(
        fx,
        side * S.footX * 0.9 + sg * 30 * aT + (aT < 0.3 ? 0 : 6),
        P.sit,
      );
      fy = lerp(fy, -ry * 0.75, P.sit);
      ang = lerp(ang, -sg * 0.5 * aT - side * 0.25 * (1 - aT), P.sit);
      rx *= 1 + 0.12 * P.sit;
    }
    const y = fy - lift;
    if (S.legs) {
      const top = bodyLocal(S, P).c[1] + S.bodyR[1] * 0.55;
      g.capsule(fx * 0.85, top, fx, y - 2, 10, 9, S.body);
    }
    if (kind === "mattie") {
      const top = -22 + P.sit * S.sitDrop;
      g.capsule(fx * 0.8, top, fx, y - 3, 7.5, 7, "#f5c09a");
    }
    if (kind === "lou")
      g.box(fx, y, S.footR[0] - 2, S.footR[1], 6, S.foot, { ang });
    else g.ellipse(fx, y, rx, ry, S.foot, { ang });
    if (kind === "juno") {
      for (const k of [-1, 0, 1])
        g.circle(fx + sg * 9 + k * 6, y + 4 - Math.abs(k) * 1.5, 4.2, S.foot, {
          ol: 2,
        });
    }
  }
}

// Arms: short tapered tubes ending in a mitten. A world target makes
// the hand land exactly there (contacts); otherwise an angle.
function drawArm(g, P, S, kind, side, spec, front, bodyIdx, report) {
  const s = shoulderLocal(S, P, side);
  const far = side !== (P.turn >= 0 ? 1 : -1) && Math.abs(P.turn) > 0.3;
  const reach = S.reach * (far ? 1.6 : 1);
  let dir, len;
  if (spec.target) {
    const tl = M.ap(M.inv(g.m), spec.target[0], spec.target[1]);
    const dx = tl[0] - s[0],
      dy = tl[1] - s[1];
    const dist = Math.hypot(dx, dy) || 1;
    dir = [dx / dist, dy / dist];
    const want = dist - S.handR * 0.45;
    len = clamp(want, S.reach * 0.5, reach);
    if (report)
      report.push({
        who: kind,
        side,
        gap: Math.max(0, want - reach),
        short: Math.max(0, S.reach * 0.5 - want),
      });
  } else {
    const a = spec.ang;
    dir = [Math.cos(a), Math.sin(a)];
    len = S.reach * (spec.len ?? 0.82);
  }
  const w = [s[0] + dir[0] * len, s[1] + dir[1] * len];
  const clip = front ? { clip: bodyIdx, clipMode: 1 } : {};
  g.capsule(
    s[0] - dir[0] * 8,
    s[1] - dir[1] * 8,
    w[0],
    w[1],
    S.armR[0],
    S.armR[1],
    S.arm,
    clip,
  );
  const ang = Math.atan2(dir[1], dir[0]);
  const hc = [w[0] + dir[0] * S.handR * 0.45, w[1] + dir[1] * S.handR * 0.45];
  if (kind === "juno") {
    for (const k of [-1, 0, 1]) {
      const a = ang + k * 0.5;
      g.capsule(
        hc[0] - dir[0] * 8,
        hc[1] - dir[1] * 8,
        hc[0] + Math.cos(a) * 17,
        hc[1] + Math.sin(a) * 17,
        9,
        6,
        S.hand,
      );
    }
    return;
  }
  const up = [dir[1], -dir[0]];
  const flip = side * (P.turn >= 0 ? 1 : -1) < 0 ? -1 : 1;
  g.ellipse(
    hc[0] + up[0] * S.handR * 0.7 * flip + dir[0] * 2,
    hc[1] + up[1] * S.handR * 0.7 * flip + dir[1] * 2,
    S.handR * 0.45,
    S.handR * 0.36,
    S.hand,
    { ang },
  );
  g.ellipse(hc[0], hc[1], S.handR, S.handR * 0.86, S.hand, { ang });
}

// Faces: dot eyes with white surrounds, simple brows and mouths.
const FACES = {
  happy: { eyes: "open", brow: 0, mouth: "smile" },
  det: { eyes: "open", brow: 1, mouth: "flat" },
  strain: { eyes: "squeeze", brow: 1.2, mouth: "grit" },
  sad: { eyes: "open", brow: -1, mouth: "frown", lookDown: true },
  pant: { eyes: "half", brow: -0.4, mouth: "o" },
  wow: { eyes: "wide", brow: -0.8, mouth: "o" },
  joy: { eyes: "happy", brow: -0.4, mouth: "open" },
  grin: { eyes: "open", brow: -0.3, mouth: "open" },
  idea: { eyes: "wide", brow: -0.7, mouth: "open" },
};
function drawFace(g, P, S, hc, R, opts = {}) {
  const T = P.turn,
    aT = Math.abs(T),
    sg = T >= 0 ? 1 : -1;
  const F = FACES[P.face] || FACES.happy;
  const fx = T * 0.4 * R;
  const browCol = opts.brow || INK;
  const eyeY = hc[1] - 0.1 * R + (opts.eyeY || 0);
  const look = F.lookDown ? [P.look[0] * 0.5, 0.6] : P.look;
  for (const side of [-1, 1]) {
    const near = side === sg || aT < 0.05;
    const k = near ? 1 - 0.08 * aT : 1 - 0.36 * aT;
    const ex =
      hc[0] + fx + side * 0.36 * R * (near ? 1 - 0.12 * aT : 1 - 0.5 * aT);
    const erx = 0.24 * R * k,
      ery = 0.29 * R;
    let eyes = F.eyes;
    let blink = P.blink;
    if (eyes === "half") blink = Math.max(blink, 0.45);
    if (eyes === "open" || eyes === "half" || eyes === "wide") {
      if (blink > 0.7) {
        g.arc(ex, eyeY + 2, erx * 0.9, 0.35, Math.PI - 0.35, 1.8, INK);
      } else {
        const big = eyes === "wide" ? 1.14 : 1;
        const wy = ery * big * (1 - blink * 0.9);
        const white = g.ellipse(ex, eyeY, erx * big, wy, "#ffffff", {
          ol: 2.2,
          shade: 0.4,
        });
        const pr = 0.135 * R * (eyes === "wide" ? 0.8 : 1);
        const px = ex + look[0] * erx * 0.42,
          py = eyeY + look[1] * wy * 0.4;
        g.circle(px, py, pr, INK, {
          ol: 0,
          shade: 0,
          clip: white,
          clipMode: 2,
        });
        g.circle(px - pr * 0.35, py - pr * 0.4, pr * 0.34, "#ffffff", {
          ol: 0,
          shade: 0,
          clip: white,
          clipMode: 2,
        });
      }
    } else if (eyes === "happy") {
      g.arc(ex, eyeY + 4, erx * 0.95, -Math.PI + 0.45, -0.45, 2, INK);
    } else if (eyes === "squeeze") {
      const d = side * 0.18 * R;
      g.capsule(ex - d * 0.9, eyeY - 6, ex + d * 0.4, eyeY, 2, 2, INK, {
        shade: 0,
        ol: 0,
      });
      g.capsule(ex + d * 0.4, eyeY, ex - d * 0.9, eyeY + 6, 2, 2, INK, {
        shade: 0,
        ol: 0,
      });
    }
    // brow: inner end lower when determined, higher when sad
    const by = eyeY - 0.43 * R;
    const inner = ex - side * 0.15 * R * k,
      outer = ex + side * 0.15 * R * k;
    g.capsule(
      outer,
      by - 3 * F.brow,
      inner,
      by + 4 * F.brow,
      2.4,
      2.6,
      browCol,
      { shade: 0, ol: 0 },
    );
  }
  if (opts.mouth === false) return;
  // mouth
  const mx = hc[0] + fx * 1.08,
    my = hc[1] + S.mouthY * R + (opts.mouthDY || 0);
  const mw = 0.22 * R * (1 - 0.25 * aT);
  if (F.mouth === "smile")
    g.arc(mx, my - mw * 0.55, mw, 0.5, Math.PI - 0.5, 1.7, INK);
  else if (F.mouth === "flat")
    g.capsule(mx - mw * 0.6, my, mx + mw * 0.6, my, 1.8, 1.8, INK, {
      shade: 0,
      ol: 0,
    });
  else if (F.mouth === "frown")

// Body layer for each kind, returns the body index (for limb fades).
function drawBody(g, P, S, kind) {
  const B = bodyLocal(S, P);
  const T = P.turn,
    aT = Math.abs(T);
  if (kind === "mattie") {
    const body = g.trap(B.c[0], B.c[1] + 4, 36, 21, 34, 8, S.body);
    g.box(B.c[0] + T * 3, B.c[1] - 8, 30, 5, 4, "#ecc965", {
      clip: body,
      clipMode: 2,
      ol: 2,
      shade: 0.5,
    });
    g.trap(B.c[0] + T * 8, B.c[1] - 34, 9, 5, 7, 2, "#a084d9", {
      ol: 0,
      clip: body,
      clipMode: 2,
      shade: 0,
    });
    return body;
  }
  const body = g.ellipse(B.c[0], B.c[1], B.r[0], B.r[1], S.body);
  g.ellipse(
    B.c[0] + T * B.r[0] * 0.32,
    B.c[1] + 7,
    B.r[0] * 0.58 * (1 - 0.25 * aT),
    B.r[1] * 0.68,
    S.belly,
    { ol: 0, clip: body, clipMode: 2 },
  );
  if (kind === "juno")
    g.scallop(B.c[0] - T * 4, B.c[1] - B.r[1] + 6, 30, 6, 9, 0.5, "#fbf7ef");
  return body;
}

function drawCharacter(g, kind, P, report) {
  if (!P.visible) return;
  const S = SPEC[kind];
  const T = P.turn,
    aT = Math.abs(T),
    sg = T >= 0 ? 1 : -1;
  g.save();
  g.m = M.mul(g.m, rootMatrix(P));
  if (S.wings) drawWings(g, P, S);
  drawTail(g, P, S, kind);
  const nearSide = sg;
  const farSide = -sg;
  const frontNear = aT > 0.3;
  // far arm (and both arms when facing front) behind the body
  drawArm(
    g,
    P,
    S,
    kind,
    farSide,
    P.arms[farSide < 0 ? "L" : "R"],
    false,
    -1,
    report,
  );
  if (!frontNear)
    drawArm(
      g,
      P,
      S,
      kind,
      nearSide,
      P.arms[nearSide < 0 ? "L" : "R"],
      false,
      -1,
      report,
    );
  drawFeet(g, P, S, kind);
  const body = drawBody(g, P, S, kind);
  if (frontNear)
    drawArm(
      g,
      P,
      S,
      kind,
      nearSide,
      P.arms[nearSide < 0 ? "L" : "R"],
      true,
      body,
      report,
    );
  const neck = [S.neck[0] + T * 3, S.neck[1] + P.sit * S.sitDrop + P.bob];
  const hc = [S.headC[0] + T * 4, S.headC[1] + P.sit * S.sitDrop + P.bob];
  g.save();
  g.apply(M.tr(neck[0], neck[1]));
  g.apply(M.rot(P.headTilt));
  g.apply(M.tr(-neck[0], -neck[1]));
  HEADS[kind](g, P, S, hc);
  g.restore();
  g.restore();

        const K = CHAR_SCALE;
        if (i === 0) return { R: rimPointAt(shN[1] + 4), L: rimPointAt(shN[1] - 10 * K) };
        const front = ORDER[i - 1];
        const nb = bodyBackAt(front, poses[front], shN[1] + 4);
        const fb = bodyBackAt(front, poses[front], shN[1] - 10 * K);
        return { R: [nb[0] - S.handR * 0.6 * K, nb[1]], L: [fb[0] - S.handR * 0.4 * K, fb[1]] };
      }

      function poseAll(t) {
        const poses = {};
        const strain = strainAt(t);
        const tremble = strain * Math.sin(t * 95) * 1.2;
        const dip = countDip(t);
        const heave = bump(t, CUE.heave - 0.15, CUE.spin[0] + 0.05);
        const common = (P) => {
          P.t = t;
          P.sy *= 1 - 0.05 * strain - 0.07 * dip + 0.05 * heave;
          P.sx *= 1 + 0.05 * strain + 0.06 * dip - 0.03 * heave;
          P.lean += 0.05 * strain - 0.1 * dip + 0.18 * heave;
          P.x += tremble;
        };
        // ----- Leo -----
        {
          const P = basePose({ k: CHAR_SCALE, y: GROUND });
          P.blink = blinkAt(t, 3.3, 0.4);
          const w = walker(t, CUE.leoIn, -110, LINE.leo - 14, 120, 12);
          Object.assign(P, { x: w.x, walk: w.walk, bob: w.bob });
          P.arms = w.walk ? { L: { ang: 1.75 + 0.35 * Math.sin(w.walk.phase * TAU) }, R: { ang: 1.25 - 0.35 * Math.sin(w.walk.phase * TAU) } } : P.arms;
          // look up at the wheel, hop with resolve
          const look = win(t, CUE.leoLook[0], CUE.leoLook[0] + 0.3) * (1 - win(t, CUE.leoPlant[0], CUE.leoPlant[1]));
          P.headTilt = -0.28 * look;
          P.look = [0.5, -0.6 * look];
          if (t > CUE.leoLook[0] + 0.25) P.face = "det";
          P.lift = 14 * bump(t, CUE.leoHop - 0.05, CUE.leoHop + 0.3);
          P.sy *= 1 - 0.08 * bump(t, CUE.leoHop - 0.15, CUE.leoHop) - 0.08 * bump(t, CUE.leoHop + 0.3, CUE.leoHop + 0.45);
          // step in and plant hands on the rim
          P.x += 14 * ease.inOut(win(t, CUE.leoPlant[0], CUE.leoPlant[1]));
          const planted = t >= CUE.leoPlant[1] - 0.12;
          // push 1, then thrown back onto his bottom
          const fall = win(t, CUE.leoFall[0], CUE.leoFall[1]);
          const getUp = win(t, CUE.leoUp[0], CUE.leoUp[1]);
          const sitting = fall * (1 - getUp);
          P.x -= 34 * ease.out(fall) * (1 - ease.inOut(win(t, CUE.leoUp[1], CUE.leoReplant)));
          P.sit = sitting;
          P.sy *= 1 - 0.12 * bump(t, CUE.leoFall[1] - 0.02, CUE.leoFall[1] + 0.2);
          if (t >= CUE.push1[0]) P.face = "strain";
          if (t >= CUE.push1[1]) P.face = "wow";
          if (t >= CUE.leoFall[1]) P.face = "sad";
          if (t >= CUE.leoTurn) {
            P.turn = lerp(0.75, -0.35, ease.inOut(win(t, CUE.leoTurn, CUE.leoTurn + 0.3)) * (1 - win(t, CUE.leoUp[0] + 0.2, CUE.leoUp[1])));
            P.face = "happy";
          }
          if (t >= CUE.leoUp[0]) P.face = "det";
          if (t >= CUE.push2[0]) P.face = "strain";
          if (t >= CUE.push2[1] + 0.2) P.face = "pant";
          if (t >= CUE.push3[0]) P.face = "strain";
          if (t >= CUE.push3[1] + 0.2) P.face = "pant";
          if (t >= CUE.count[0] - 0.4) P.face = "det";
          if (t >= CUE.heave) P.face = "strain";
          poses.leo = P;
          P._contact = (planted && t < CUE.push1[2]) || (t >= CUE.leoReplant && t < CUE.spin[0]);
        }
        // ----- Lou -----
        {
          const P = basePose({ k: CHAR_SCALE, y: GROUND });
          P.blink = blinkAt(t, 3.7, 1.3);
          const w = walker(t, CUE.louIn, -170, LINE.lou, 140, 9, "out2");
          Object.assign(P, { x: w.x, walk: w.walk, bob: w.bob });
          if (w.walk) P.arms = { L: { ang: 1.7 + 0.3 * Math.sin(w.walk.phase * TAU) }, R: { ang: 1.3 - 0.3 * Math.sin(w.walk.phase * TAU) } };
          P.headTilt = 0.12 * bump(t, CUE.louIn[1] + 0.05, CUE.louIn[1] + 0.35);
          P.face = t > CUE.louIn[1] ? "det" : "happy";
          if (t >= CUE.push2[0]) P.face = "strain";
          if (t >= CUE.push2[1] + 0.2) P.face = "pant";
          if (t >= CUE.push3[0]) P.face = "strain";
          if (t >= CUE.push3[1] + 0.2) P.face = "pant";
          if (t >= CUE.count[0] - 0.4) P.face = "det";
          if (t >= CUE.heave) P.face = "strain";
          P.visible = t > CUE.louIn[0];
          poses.lou = P;
          P._contact = t >= CUE.louHands - 0.25 && t < CUE.spin[0];
          P._reach = win(t, CUE.louHands - 0.25, CUE.louHands);
        }
        // ----- Juno -----
        {
          const P = basePose({ k: CHAR_SCALE, y: GROUND });
          P.blink = blinkAt(t, 2.9, 2.2);
          const u = win(t, CUE.junoIn[0], CUE.junoIn[1]);
          const flying = t > CUE.junoIn[0] && t < CUE.junoIn[1];
          P.x = lerp(-140, LINE.juno, ease.out2(u));
          P.lift = t < CUE.junoIn[1] ? 520 * (1 - u) ** 1.7 + 70 * Math.sin(Math.PI * u) : 0;
          P.turn = 0.6;
          P.lean = flying ? 0.22 : 0;
          const f = Math.sin(t * TAU * 5.2);
          if (flying) P.arms = { L: { ang: Math.PI + 0.25 - 1.0 * f, len: 0.95 }, R: { ang: -0.25 + 1.0 * f, len: 0.95 } };
          else P.arms = { L: { ang: 1.85 }, R: { ang: 1.3 } };
          const land = bump(t, CUE.junoIn[1] - 0.02, CUE.junoIn[1] + 0.25);
          P.sy *= 1 - 0.14 * land;
          P.sx *= 1 + 0.1 * land;
          P.turn = t > CUE.junoIn[1] ? lerp(0.6, 0.75, win(t, CUE.junoIn[1], CUE.junoIn[1] + 0.3)) : 0.6;
          P.face = flying ? "grin" : "det";
          if (t >= CUE.push3[0]) P.face = "strain";
          if (t >= CUE.push3[1] + 0.2) P.face = "pant";
          if (t >= CUE.count[0] - 0.4) P.face = "det";
          if (t >= CUE.heave) P.face = "strain";
          P.visible = t > CUE.junoIn[0];
          poses.juno = P;
          P._contact = t >= CUE.junoHands - 0.25 && t < CUE.spin[0];
          P._reach = win(t, CUE.junoHands - 0.25, CUE.junoHands);
        }
        // ----- Mattie -----
        {
          const P = basePose({ k: CHAR_SCALE, y: GROUND });
          P.blink = blinkAt(t, 4.1, 0.9);
          const w = walker(t, CUE.mattieIn, -130, LINE.mattie, 110, 11, "out2");
          Object.assign(P, { x: w.x, walk: w.walk, bob: w.bob * 1.3 });
          if (w.walk) P.arms = { L: { ang: 1.7 + 0.5 * Math.sin(w.walk.phase * TAU) }, R: { ang: 1.2 - 0.5 * Math.sin(w.walk.phase * TAU) } };
          P.face = "grin";
          const idea = bump(t, CUE.mattieIdea - 0.05, CUE.mattieHands - 0.22);
          if (idea > 0) {
            P.arms.R = { ang: lerp(1.3, -1.5, Math.min(1, idea * 2)), len: 0.95 };
            P.face = "idea";
            P.lift = 10 * bump(t, CUE.mattieIdea, CUE.mattieIdea + 0.25);
          }
          P._idea = idea;
          if (t >= CUE.mattieHands) P.face = "det";
          if (t >= CUE.count[0]) P.face = "grin";
          if (t >= CUE.heave) P.face = "strain";
          P.visible = t > CUE.mattieIn[0];
          poses.mattie = P;
          P._contact = t >= CUE.mattieHands - 0.25 && t < CUE.spin[0];
          P._reach = win(t, CUE.mattieHands - 0.25, CUE.mattieHands);
        }
        // ----- shared beats: push effort, then the tumble, the watch and the cheer -----
        ORDER.forEach((kind, i) => {
          const P = poses[kind];
          if (t < CUE.spin[0] + 0.05) common(P);
          // tumble back onto their bottoms when the wheel gives
          const tb = CUE.tumble[i];
          const cheer = CUE.cheer[i];
          if (t >= CUE.spin[0]) {
            const fall = ease.out(win(t, CUE.spin[0], tb + 0.12));
            const up = win(t, cheer, cheer + 0.25);
            P.sit = Math.max(P.sit, fall * (1 - up));
            P.x = LINE[kind] - 28 * fall + 2 * Math.sin(t * 2 + i);
            P.lean = lerp(0.2, -0.12, fall) * (1 - up);
            P.sy = 1 - 0.14 * bump(t, tb + 0.05, tb + 0.28);
            P.sx = 1 + 0.1 * bump(t, tb + 0.05, tb + 0.28);
            P.face = t < tb + 0.4 ? "wow" : "wow";
            P.turn = lerp(0.75, 0.35, win(t, tb + 0.2, tb + 0.8));
            const lookUp = win(t, tb + 0.2, tb + 0.8);
            P.headTilt = -0.32 * lookUp;
            P.look = [0.7, -0.8];
            const flail = (a0, a1, a2) => (fall < 0.3 ? lerp(a0, a1, fall / 0.3) : lerp(a1, a2, (fall - 0.3) / 0.7));
            P.arms = { L: { ang: flail(0.2, -2.3, 2.1) }, R: { ang: flail(0.1, -0.9, 1.0) } };
            if (t >= CUE.spin[1]) {
              P.face = "joy";
            }
            if (t >= cheer) {
              const k = t - cheer;
              const hops = [0, 0.75, 1.5, 2.25, 3.0];
              let lift = 0;
              hops.forEach((h, j) => (lift = Math.max(lift, (j < 4 ? 46 - j * 8 : 20) * bump(k, h, h + 0.55))));
              P.lift = lift;
              P.sit = Math.min(P.sit, 1 - up);
              P.turn = lerp(0.35, i % 2 ? 0.12 : -0.12, win(t, cheer, cheer + 0.4));
              P.headTilt = -0.08 * Math.sin(k * 5 + i);
              P.look = [0.0, -0.2];
              const wave = Math.sin(k * 9 + i);
              P.arms = { L: { ang: -2.25 + 0.25 * wave }, R: { ang: -0.9 - 0.25 * wave } };
              const land = hops.reduce((s, h) => Math.max(s, bump(k, h + 0.5, h + 0.7)), 0);
              P.sy = 1 - 0.1 * land + 0.06 * Math.min(1, lift / 30);
              P.sx = 1 + 0.08 * land - 0.04 * Math.min(1, lift / 30);
              P.lean = 0;
              P.face = "joy";
            }
          }
        });
        // contacts: hands land on the rim or on the back in front
        for (const kind of ORDER) {
          const P = poses[kind];
          if (!P._contact) continue;
          const T = pushTargets(kind, poses, P);
          const r = P._reach ?? 1;
          if (r >= 1) P.arms = { L: { target: T.L }, R: { target: T.R } };
          else {
            P.arms = { L: { ang: lerp(1.6, 0.25, r) }, R: { ang: lerp(1.3, 0.1, r) } };
          }
          P.flap = 0.2 * strainAt(t);
        }
        // Leo reaching toward the rim before his hands land
        if (t >= CUE.leoPlant[0] && t < CUE.leoPlant[1] - 0.12) {
          const r = win(t, CUE.leoPlant[0], CUE.leoPlant[1] - 0.12);
          poses.leo.arms = { L: { ang: lerp(1.6, 0.0, r) }, R: { ang: lerp(1.3, -0.05, r) } };
        }
        // Leo flung back after push 1: arms fly up
        if (t >= CUE.push1[2] && t < CUE.leoUp[0]) {
          const k = win(t, CUE.push1[2], CUE.leoFall[1]);
          poses.leo.arms = { L: { ang: lerp(-0.4, 2.0, ease.out(win(t, CUE.leoFall[1], CUE.leoFall[1] + 0.5))) - 1.2 * (1 - k) * k * 4 }, R: { ang: lerp(-0.6, 1.1, ease.out(win(t, CUE.leoFall[1], CUE.leoFall[1] + 0.5))) } };
          if (t >= CUE.leoTurn) poses.leo.arms.L = { ang: lerp(2.0, -2.0, bump(t, CUE.leoTurn + 0.1, CUE.leoUp[0])) };
        }
        // getting up: arms come back
        if (t >= CUE.leoUp[0] && t < CUE.leoReplant) {
          const r = win(t, CUE.leoUp[1], CUE.leoReplant);
          poses.leo.arms = { L: { ang: lerp(1.7, 0.0, r) }, R: { ang: lerp(1.3, -0.05, r) } };
        }
        return poses;
      }

      // =====================================================================
      // Camera: shots, drifts, dissolves and whip pans (all from t).
      // =====================================================================
      const shotCam = [
        (t) => ({ x: lerp(960, 1000, ease.inOut(win(t, 3.0, 7.3))) + 6 * Math.sin(t * 0.7), y: lerp(540, 640, ease.inOut(win(t, 3.0, 7.3))) + 4 * Math.sin(t * 0.5), z: lerp(1.0, 1.3, ease.inOut(win(t, 3.0, 7.3))) }),
        (t) => ({ x: lerp(820, 840, win(t, 7.3, 12.2)) + 5 * Math.sin(t * 0.8), y: 650 + 4 * Math.sin(t * 0.6), z: lerp(1.34, 1.38, win(t, 7.3, 12.2)) }),
        (t) => ({ x: lerp(750, 770, win(t, 12.45, 17)) + 5 * Math.sin(t * 0.7), y: 640 + 4 * Math.sin(t * 0.5), z: lerp(1.1, 1.16, win(t, 12.45, 17)) }),
        (t) => {
          const shake = bump(t, CUE.heave, CUE.heave + 0.45);
          return { x: 690 + 8 * shake * Math.sin(t * 70), y: 670 + 6 * shake * Math.sin(t * 53), z: lerp(1.2, 1.25, win(t, 17, 18.6)) };
        },
        (t) => ({ x: 1240 + 4 * Math.sin(t * 0.6), y: lerp(300, 290, win(t, 18.6, 24)) + 3 * Math.sin(t * 0.8), z: lerp(1.66, 1.78, win(t, 18.6, 24)) }),
        (t) => ({ x: lerp(990, 960, ease.inOut(win(t, 24.3, 27.5))) + 5 * Math.sin(t * 0.6), y: lerp(600, 540, ease.inOut(win(t, 24.3, 27.5))) + 3 * Math.sin(t * 0.7), z: lerp(1.16, 1.0, ease.inOut(win(t, 24.3, 27.5))) }),
      ];
      // Which view(s) to draw at t: one camera, a dissolve, or a whip.
      function cameraAt(t) {
        const shots = CUE.shots;
        let i = shots.findIndex(([a, b]) => t >= a && t < b);
        if (i < 0) i = shots.length - 1;
        const [start, , kind] = shots[i];
        if (kind === "dissolve" && t < start + CUE.dissolve / 2 && i > 0)
          return { mode: "mix", a: shotCam[i - 1](t), b: shotCam[i](t), k: ease.sine(0.5 + (t - start) / CUE.dissolve) };
        if (kind === "dissolve" && i + 1 < shots.length) {
          /* nothing */
        }
        const next = shots[i + 1];
        if (next && next[2] === "dissolve" && t > next[0] - CUE.dissolve / 2)
          return { mode: "mix", a: shotCam[i](t), b: shotCam[i + 1](t), k: ease.sine((t - (next[0] - CUE.dissolve / 2)) / CUE.dissolve) };
        if (kind === "whip" && t < start + CUE.whip / 2 && i > 0)
          return { mode: "whip", from: shotCam[i - 1], to: shotCam[i], u: 0.5 + (t - start) / CUE.whip, t0: start - CUE.whip / 2 };
        if (next && next[2] === "whip" && t > next[0] - CUE.whip / 2)
          return { mode: "whip", from: shotCam[i], to: shotCam[i + 1], u: (t - (next[0] - CUE.whip / 2)) / CUE.whip, t0: next[0] - CUE.whip / 2 };
        return { mode: "one", cam: shotCam[i](t) };
      }
      function whipCam(c, t, u) {
        const a = c.from(t), b = c.to(t);
        const e = ease.inOut(clamp(u));
        return { x: lerp(a.x, b.x, e), y: lerp(a.y, b.y, e), z: lerp(a.z, b.z, e) * (1 - 0.12 * Math.sin(Math.PI * clamp(u))) };
      }

      // =====================================================================
      // Scene assembly: every group for one frame.
      // =====================================================================
      function confettiGroups(t, groups) {
        const bursts = [
          { t0: CUE.confetti[0], x: WHEEL.x, y: WHEEL.y - WHEEL.r - 20, n: 46, spread: [-2.6, -0.5], v: [520, 980], seed: 3 },
          { t0: CUE.confetti[1], x: 300, y: GROUND - 10, n: 30, spread: [-1.4, -0.95], v: [950, 1350], seed: 7 },
          { t0: CUE.confetti[1] + 0.08, x: 1700, y: GROUND - 10, n: 30, spread: [-2.2, -1.75], v: [950, 1350], seed: 11 },
        ];
        const cols = ["#27467f", "#a3302b", "#5e3473", "#2c6a4d", "#ecc965", "#b85c25", "#fbf9f4"];
        for (const b of bursts) {
          const dt = t - b.t0;
          if (dt < 0) continue;
          for (let i = 0; i < b.n; i++) {
            const a = lerp(b.spread[0], b.spread[1], hash(i, b.seed));
            const v = lerp(b.v[0], b.v[1], hash(i, b.seed + 1));
            const k = 0.55;
            const g0 = 900;
            const ex = 1 - Math.exp(-dt / k);
            const x = b.x + Math.cos(a) * v * k * ex + Math.sin(dt * 3 + i) * 14;
            const y = b.y + (Math.sin(a) * v + g0 * k) * k * ex - g0 * k * dt;
            if (y > GROUND + 40) continue;
            const g = new Group();
            const flip = Math.abs(Math.cos(dt * (5 + 6 * hash(i, b.seed + 2)) + i));
            g.box(x, y, 8 * (0.25 + 0.75 * flip), 12, 2.5, cols[i % cols.length], { ang: dt * (2 + 4 * hash(i, b.seed + 3)) + i, ol: 1.8, shade: 0.4 });
            groups.push(g);
          }
        }
        // a gentle confetti rain over the celebration
        for (let i = 0; i < 70; i++) {
          const t0 = CUE.confetti[0] + 0.2 + 1.6 * hash(i, 41);
          const dt = t - t0;
          if (dt < 0) continue;
          const y = -60 + dt * (150 + 90 * hash(i, 42));
          if (y > GROUND + 30) continue;
          const x = 120 + 1700 * hash(i, 43) + 40 * Math.sin(dt * (1.5 + hash(i, 44)) + i);
          const g = new Group();
          const flip = Math.abs(Math.cos(dt * (4 + 5 * hash(i, 45)) + i));
          g.box(x, y, 8 * (0.25 + 0.75 * flip), 12, 2.5, cols[(i + 3) % cols.length], { ang: dt * (1.5 + 3 * hash(i, 46)) + i, ol: 1.8, shade: 0.4 });
          groups.push(g);
        }
      }

      function buildFrame(t, report) {
        const groups = [];
        const poses = poseAll(t);
        // floor shadows
        const sh = new Group();
        sh.soft(WHEEL.x, GROUND + 4, 190, 16, "#2a1530", { alpha: 0.32, core: 0.3 });
        for (const kind of ORDER) {
          const P = poses[kind];
          if (!P.visible) continue;
          const k = clamp(1 - P.lift / 500);
          sh.soft(P.x + P.turn * 6, GROUND + 3, 52 * (0.6 + 0.4 * k), 10 * (0.6 + 0.4 * k), "#2a1530", { alpha: 0.34 * k, core: 0.35 });
        }
        groups.push(sh);
        // drifting dust motes in the stage light
        for (let i = 0; i < 26; i++) {
          const g = new Group();
          const x = 80 + 1760 * hash(i, 21) + 30 * Math.sin(t * 0.4 + i);
          const y = 80 + fract(hash(i, 22) - t * (0.012 + 0.01 * hash(i, 23))) * 740;
          g.soft(x, y, 3 + 3 * hash(i, 24), 3 + 3 * hash(i, 24), "#f6e7c8", { alpha: 0.22, core: 0.1 });
          groups.push(g);
        }
        // pedestal post (behind the wheel) and the wheel's edge
        const post = new Group();
        post.box(WHEEL.x, 460, 15, 392, 8, "#9a6a3c", { shade: 1 });
        post.circle(WHEEL.x + 7, WHEEL.y + 9, WHEEL.r + 2, "#1a0d20", { ol: 3 });
        groups.push(post);
        groups.push("WHEEL");
        // wheel rim outline, pointer, base
        const top = new Group();
        top.ring(WHEEL.x, WHEEL.y, WHEEL.r - 1, WHEEL.r - 1, 1.6, INK, { ol: 0, shade: 0 });
        top.save();
        top.apply(M.tr(WHEEL.x, 84));
        top.apply(M.rot(0.42 * pointerKick(t) + 0.03 * Math.sin(t * 2.2)));
        top.tri(0, 0, 46, 21, 4, "#ecc965", { ang: Math.PI / 2, ol: 2.8, shade: 0.8 });
        top.circle(0, 0, 13, "#3d1f4a", { ol: 2.6, shade: 0.8 });
        top.circle(0, 0, 4.5, "#ecc965", { ol: 0, shade: 0 });
        top.restore();
        top.box(WHEEL.x, GROUND - 15, 140, 16, 10, "#d9a05b", { shade: 1 });
        top.box(WHEEL.x, GROUND - 33, 70, 6, 4, "#b9824a", { shade: 1 });
        groups.push(top);
        // characters, back of the line drawn last so their hands sit on top
        for (const kind of ORDER) {
          const g = new Group();
          drawCharacter(g, kind, poses[kind], poses[kind]._contact ? report : null);
          if (g.prims.length) groups.push(g);
        }
        // Mattie's idea: a little sparkle over her raised hand
        const idea = poses.mattie._idea || 0;
        if (idea > 0.2) {
          const g = new Group();
          const P = poses.mattie;
          g.save();
          g.apply(M.tr(P.x + 22 * CHAR_SCALE, P.y - P.lift - 205 * CHAR_SCALE));
          g.apply(M.rot(t * 3));
          g.scallop(0, 0, 3 * idea, 13 * idea, 4, 0, "#ecc965", { ol: 2.2, shade: 0.4 });
          g.restore();
          groups.push(g);
        }
        confettiGroups(t, groups);
        return { groups, poses };
      }

      // =====================================================================
      // WebGL
      // =====================================================================
      const canvas = document.getElementById("c");

        let peak = 0;
        for (let i = 0; i < N; i++) {
          const fade = Math.min(1, (N - i) / (0.35 * sr));
          L[i] = Math.tanh(L[i] * 1.1) * fade;
          R[i] = Math.tanh(R[i] * 1.1) * fade;
          peak = Math.max(peak, Math.abs(L[i]), Math.abs(R[i]));
        }
        const g = 0.89 / (peak || 1);
        for (let i = 0; i < N; i++) {
          L[i] *= g;
          R[i] *= g;
        }
        return { sr, L, R };
      }
      function wavBase64(audio) {
        const { sr, L, R } = audio;
        const n = L.length;
        const buf = new ArrayBuffer(44 + n * 4);
        const v = new DataView(buf);
        const str = (o, s) => [...s].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
        str(0, "RIFF"); v.setUint32(4, 36 + n * 4, true); str(8, "WAVE"); str(12, "fmt ");
        v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 2, true);
        v.setUint32(24, sr, true); v.setUint32(28, sr * 4, true); v.setUint16(32, 4, true); v.setUint16(34, 16, true);
        str(36, "data"); v.setUint32(40, n * 4, true);
        for (let i = 0; i < n; i++) {
          v.setInt16(44 + i * 4, clamp(L[i], -1, 1) * 32767, true);
          v.setInt16(46 + i * 4, clamp(R[i], -1, 1) * 32767, true);
        }
        const bytes = new Uint8Array(buf);
        let s = "";
        for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
        return btoa(s);
      }

      // ---------- character sheet: front, three-quarter and side ----------
      function sheetLabels() {
        const c = document.createElement("canvas");
        c.width = W;
        c.height = H;
        const g = c.getContext("2d");
        g.fillStyle = "#fbf9f4";
        g.font = "800 44px Alexandria";
        g.fillText("The companions", 70, 84);
        g.font = "600 24px Alexandria";
        g.fillStyle = "rgba(236,226,204,0.75)";
        g.fillText("Flat 2D, one piece, outline #2a2230, three light bands", 70, 122);
        const names = [["Leo", "lion · St Mark"], ["Lou", "ox · St Luke"], ["Juno", "eagle · St John"], ["Mattie", "human · St Matthew"]];
        names.forEach(([n, d], i) => {
          const x = 330 + i * 400;
          g.textAlign = "center";
          g.fillStyle = "#ecc965";
          g.font = "800 34px Alexandria";
          g.fillText(n, x, 190);
          g.fillStyle = "rgba(236,226,204,0.8)";
          g.font = "600 22px Alexandria";
          g.fillText(d, x, 222);
        });
        g.textAlign = "left";
        ["Front", "Three-quarter", "Full turn"].forEach((v, r) => {
          g.save();
          g.translate(70, 420 + r * 280);
          g.rotate(-Math.PI / 2);
          g.fillStyle = "rgba(236,226,204,0.75)";
          g.font = "700 24px Alexandria";
          g.textAlign = "center";
          g.fillText(v, 0, 0);
          g.restore();
        });
        return c;
      }
      let labelTex = null;
      function renderSheet() {
        labelTex ||= canvasTexture(sheetLabels());
        const groups = [];
        const bg = new Group();
        bg.box(960, 540, 1000, 600, 0, "#3d1f4a", { ol: 0, shade: 0 });
        for (let r = 0; r < 3; r++) bg.box(960, 498 + r * 280, 820, 2, 1, "#5a3466", { ol: 0, shade: 0 });
        groups.push(bg);
        ORDER.forEach((kind, i) => {
          [0, 0.75, 1].forEach((turn, r) => {
            const P = { ...basePose({ k: CHAR_SCALE, y: GROUND }), x: 330 + i * 400, y: 496 + r * 280, turn, t: 0.4, sx: 0.62, sy: 0.62, face: r === 0 ? "happy" : "grin", look: [turn * 0.6, 0] };
            P.arms = turn ? { L: { ang: 1.75 }, R: { ang: 1.3 } } : { L: { ang: 1.95 }, R: { ang: 1.2 } };
            const g = new Group();
            drawCharacter(g, kind, P, null);
            groups.push(g);
          });
        });
        const ranges = uploadPrims(groups);
        const cam = { x: 960, y: 540, z: 1 };
        gl.bindFramebuffer(gl.FRAMEBUFFER, targets.a.fb);
        gl.viewport(0, 0, W, H);
        gl.enable(gl.BLEND);
        gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
        gl.clearColor(0, 0, 0, 1);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.useProgram(prog.prim.p);
        for (const r of ranges) {
          setCam(prog.prim, cam);
          gl.activeTexture(gl.TEXTURE0);
          gl.bindTexture(gl.TEXTURE_2D, dataTex);
          gl.uniform1i(prog.prim.u.uData, 0);
          gl.uniform1i(prog.prim.u.uStart, r.start);
          gl.uniform1i(prog.prim.u.uCount, r.count);
          gl.uniform1f(prog.prim.u.uZoom, 1);
          gl.uniform4f(prog.prim.u.uBox, ...r.box);
          gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
        }
        gl.useProgram(prog.tex.p);
        gl.uniform3f(prog.tex.u.uCam, 960, 540, 1);
        gl.activeTexture(gl.TEXTURE1);
        gl.bindTexture(gl.TEXTURE_2D, labelTex);
        gl.uniform1i(prog.tex.u.uTex, 1);
        gl.uniform4f(prog.tex.u.uWheel, 0, 0, 0, 0);
        gl.uniform4f(prog.tex.u.uRect, 0, 0, W, H);
        gl.uniform4f(prog.tex.u.uBox, 0, 0, W, H);
        gl.uniform1f(prog.tex.u.uAlpha, 1);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
        post(targets.a.tex, targets.a.tex, 0, 0);
      }

      // ---------- API for the offline renderer, and the play button ----------
      const ready = init();
      window.KINESA = {
        ready,
        fps: FPS,
        duration: DURATION,
        cue: CUE,
        renderFrame: (t) => renderFrame(t),
        renderSheet: () => renderSheet(),
        audioWav: () => wavBase64(synthAudio(48000)),
        line: LINE,
        poses: (t) => poseAll(t),
        contacts: (t) => {
          const report = [];
          buildFrame(t, report);
          return report;
        },
      };
      const playBtn = document.getElementById("play");
      let audioCtx = null, startAt = 0, playing = false, audioBuffer = null;
      async function play() {
        await ready;
        audioCtx ||= new AudioContext();
        if (!audioBuffer) {
          const a = synthAudio(audioCtx.sampleRate);
          audioBuffer = audioCtx.createBuffer(2, a.L.length, a.sr);
          audioBuffer.copyToChannel(a.L, 0);
          audioBuffer.copyToChannel(a.R, 1);
        }
        const src = audioCtx.createBufferSource();
        src.buffer = audioBuffer;
        src.connect(audioCtx.destination);
        await audioCtx.resume();
        startAt = audioCtx.currentTime + 0.05;
        src.start(startAt);
        playing = true;
        playBtn.hidden = true;
        const loop = () => {
          const t = audioCtx.currentTime - startAt;
          renderFrame(Math.max(0, t));
          if (t < DURATION) requestAnimationFrame(loop);
          else {
            playing = false;
            playBtn.textContent = "↻ Play again (click or space)";
            playBtn.hidden = false;
          }
        };
        requestAnimationFrame(loop);
      }
      if (RENDER) playBtn.hidden = true;
      else {
        ready.then(() => renderFrame(0.0));
        playBtn.addEventListener("click", () => !playing && play());
        addEventListener("keydown", (e) => {
          if (e.code === "Space" && !playing) {
            e.preventDefault();
            play();
          }
        });
      }
    </script>
  </body>
