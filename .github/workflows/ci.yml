name: Verify Kinesa
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - run: npx playwright test --config playwright.webkit.config.js
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: assignment-layout-review
          path: test-results/**/assignment.png
          if-no-files-found: ignore
